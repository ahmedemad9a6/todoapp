<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #18181b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 2px;
            overflow: hidden;
        }

        .phone-shell {
            transform: scale(0.56);
            transform-origin: top center;
            padding: 8px;
            border-radius: 26px;
            background: #111115;
            border: 2px solid #2e2e38;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        iframe {
            display: block;
            width: 400px;
            height: 760px;
            border: none;
            border-radius: 18px;
            background: #121218;
        }
    </style>
</head>

<body>
    <div class="phone-shell">
        <iframe src="http://localhost:8080"></iframe>
    </div>
</body>

</html>
